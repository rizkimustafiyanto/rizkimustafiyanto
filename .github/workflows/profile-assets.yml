name: Update GitHub Profile Assets

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # Prepare output directory
      # ==========================================

      - name: Prepare output directory
        run: |
          rm -rf dist
          mkdir -p dist

      # ==========================================
      # Contribution Snake
      # ==========================================

      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # ==========================================
      # GitHub Stats
      # ==========================================

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&include_all_commits=true
          path: dist/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Top Languages
      # ==========================================

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
          path: dist/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # GitHub Streak
      # ==========================================

      - name: Generate GitHub Streak
        run: |
          curl -L \
            "https://github-readme-streak-stats-eight.vercel.app/?user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&mode=weekly" \
            -o dist/github-streak.svg

      # ==========================================
      # Verify generated files
      # ==========================================

      - name: Verify generated files
        run: |
          echo "Generated profile assets:"
          ls -lah dist

      # ==========================================
      # Deploy
      # ==========================================

      - name: Deploy Profile Assets
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
